name: Auto Tag & Release

# Déclenché par un push utilisateur sur main.
# Détermine le bump de version, crée le tag, build le ZIP et publie la release
# dans le MÊME job — évite la limitation GITHUB_TOKEN qui empêche les tags
# poussés par Actions de déclencher d'autres workflows.
#
# Convention de commits :
#   feat:  → bump mineur  (1.0.0 → 1.1.0)
#   fix: / perf: → bump patch  (1.0.0 → 1.0.1)
#   feat!: / BREAKING CHANGE → bump majeur (1.0.0 → 2.0.0)
#   Tout autre préfixe (chore:, docs:, ci:, refactor:…) → aucune release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (historique complet)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─── 1. Déterminer le bump ──────────────────────────────────────────

      - name: Déterminer le bump de version
        id: bump
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "Commit : $COMMIT_MSG"

          # Ignore les commits de release pour éviter les boucles
          if echo "$COMMIT_MSG" | grep -q "\[skip ci\]"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_TAG=$(git tag --sort=-creatordate | grep '^v[0-9]' | head -1)
          CURRENT="${LATEST_TAG#v}"
          # Si aucun tag, démarre depuis 1.0.0 (pas 0.0.0)
          if [ -z "$CURRENT" ]; then CURRENT="1.0.0"; IS_FIRST=true; else IS_FIRST=false; fi

          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)

          if echo "$COMMIT_MSG" | grep -qE "^feat!:|^[a-z]+(\(.+\))?!:|BREAKING CHANGE"; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0; BUMP="major"
          elif echo "$COMMIT_MSG" | grep -qE "^feat(\(.+\))?:"; then
            MINOR=$((MINOR + 1)); PATCH=0; BUMP="minor"
          elif echo "$COMMIT_MSG" | grep -qE "^(fix|perf)(\(.+\))?:"; then
            PATCH=$((PATCH + 1)); BUMP="patch"
          else
            echo "Préfixe sans release — fin du job."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "is_first=$IS_FIRST" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "→ $CURRENT → $NEW_TAG ($BUMP)"

      # ─── 2. Mettre à jour manifest.json ────────────────────────────────

      - name: Mettre à jour manifest.json
        if: steps.bump.outputs.skip != 'true'
        run: |
          jq --arg v "${{ steps.bump.outputs.version }}" '.version = $v' manifest.json > manifest.tmp
          mv manifest.tmp manifest.json

      # ─── 3. Générer les notes de release ───────────────────────────────

      - name: Générer les notes de release
        if: steps.bump.outputs.skip != 'true'
        run: |
          TAG="${{ steps.bump.outputs.new_tag }}"
          PREV="${{ steps.bump.outputs.prev_tag }}"

          echo "## [$TAG] — $(date +%Y-%m-%d)" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

          if [ "${{ steps.bump.outputs.is_first }}" = "true" ] || [ -z "$PREV" ]; then
            echo "_Premier release — voir [README](README.md) pour la liste complète._" >> RELEASE_NOTES.md
          else
            RANGE="$PREV..$TAG"
            FEATS=$(git log "$RANGE" --pretty="%s" 2>/dev/null | grep -E "^feat(\(.+\))?:" | sed -E 's/^feat(\(.+\))?: /- /' || true)
            FIXES=$(git log "$RANGE" --pretty="%s" 2>/dev/null | grep -E "^(fix|perf)(\(.+\))?:" | sed -E 's/^(fix|perf)(\(.+\))?: /- /' || true)
            OTHERS=$(git log "$RANGE" --pretty="%s" 2>/dev/null | grep -Ev "^(feat|fix|perf)(\(.+\))?:|^\[skip ci\]" | sed 's/^/- /' || true)

            [ -n "$FEATS" ]  && printf "### ✨ Nouvelles fonctionnalités\n%s\n\n" "$FEATS" >> RELEASE_NOTES.md
            [ -n "$FIXES" ]  && printf "### 🐛 Corrections\n%s\n\n" "$FIXES" >> RELEASE_NOTES.md
            [ -n "$OTHERS" ] && printf "### 🔧 Autres\n%s\n\n" "$OTHERS" >> RELEASE_NOTES.md
          fi

          cat RELEASE_NOTES.md

      # ─── 4. Mettre à jour CHANGELOG.md ─────────────────────────────────

      - name: Mettre à jour CHANGELOG.md
        if: steps.bump.outputs.skip != 'true'
        run: |
          { head -6 CHANGELOG.md; echo ""; cat RELEASE_NOTES.md; echo ""; tail -n +7 CHANGELOG.md; } > CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md

      # ─── 5. Committer les fichiers mis à jour ──────────────────────────

      - name: Committer manifest + CHANGELOG
        if: steps.bump.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json CHANGELOG.md
          # [skip ci] évite de re-déclencher ce workflow sur le commit de release
          git commit -m "chore(release): ${{ steps.bump.outputs.new_tag }} [skip ci]"
          git push origin main

      # ─── 6. Créer le tag ───────────────────────────────────────────────

      - name: Créer et pousser le tag
        if: steps.bump.outputs.skip != 'true'
        run: |
          git tag "${{ steps.bump.outputs.new_tag }}"
          git push origin "${{ steps.bump.outputs.new_tag }}"

      # ─── 7. Construire le ZIP de l'extension ───────────────────────────

      - name: Construire le ZIP
        if: steps.bump.outputs.skip != 'true'
        run: |
          ZIP="faciliweb-${{ steps.bump.outputs.version }}.zip"
          zip -r "$ZIP" \
            _locales/ assets/ annuaire/ glossary/ guides/ help/ \
            onboarding/ passwords/ popup/ scripts/ shortcuts/ \
            manifest.json \
            -x "*.DS_Store"
          echo "zip=$ZIP" >> "$GITHUB_ENV"
          ls -lh "$ZIP"

      # ─── 8. Publier la release GitHub ──────────────────────────────────

      - name: Créer la release GitHub
        if: steps.bump.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.new_tag }}
          name: "FaciliWeb ${{ steps.bump.outputs.new_tag }}"
          body_path: RELEASE_NOTES.md
          files: ${{ env.zip }}
          draft: false
          prerelease: false
